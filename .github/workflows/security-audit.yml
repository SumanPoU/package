name: Security audit

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Mondays 06:00 UTC
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: pnpm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Production dependency audit
        # Fail on high+; review moderate in Dependabot PRs.
        run: pnpm audit --prod --audit-level=high
      - name: Package typecheck (smoke)
        run: pnpm run typecheck:packages
